<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} — SQL Lab</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header class="nav"><a class="wordmark" href="/">SQL<span>/</span>LAB</a><nav class="nav-links"><a href="/demo/vulnerable" class="{{ 'selected' if mode == 'vulnerable' else '' }}">Vulnerable</a><a href="/demo/mitigated" class="{{ 'selected' if mode == 'safe' else '' }}">Mitigated</a><a href="/code">Code</a></nav><a class="back-link" href="/">← Intro</a></header><main class="demo-page"><div class="demo-topline"><div><span class="overline"><i></i> {{ 'VULNERABLE VERSION' if mode == 'vulnerable' else 'MITIGATED VERSION' }}</span><h1>Account lookup</h1></div><span class="demo-index">SQL INJECTION <b>/ 02</b></span></div><section class="query-card"><form id="lookupForm" data-mode="{{ mode }}"><label for="account">ACCOUNT ID / QUERY INPUT</label><div class="query-input"><input id="account" name="input" autocomplete="off" spellcheck="false" value="" placeholder="Enter account ID or load a demo query"><button type="submit">Run query <span>↗</span></button></div><div class="demo-query-options"><span>DEMO QUERIES</span><button class="load-query" type="button" data-query="all">Load all users <span>↓</span></button><button class="load-query" type="button" data-query="one">Load one user <span>↓</span></button></div></form><div class="result-title"><span>RESULT</span><span id="resultCount">READY</span></div><div id="result" class="result-box"><div class="placeholder"><span>⌕</span><p>Enter an account ID or load a demo query, then run it.</p></div></div></section><p class="demo-footnote">LOCAL CLASSROOM DEMO <i>·</i> FICTIONAL DATA</p></main><script src="{{ url_for('static', filename='demo.js') }}"></script></body></html>
